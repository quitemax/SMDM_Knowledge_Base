name: Walidacja metadanych

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Front matter i odnośniki
        run: python tools/validate_front_matter.py
      - name: Spisy dokumentów są aktualne
        run: python tools/build_indexes.py --check
